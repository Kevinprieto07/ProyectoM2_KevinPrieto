openapi: 3.0.3
info:
  title: MiniBlog API
  description: API REST para gestionar authors y posts (proyecto MiniBlog, DevSpark).
  version: 1.0.0
servers:
  - url: https://proyectom2kevinprieto-production.up.railway.app
    description: Servidor de producción (Railway)
  - url: http://localhost:3000
    description: Servidor local de desarrollo

tags:
  - name: authors
    description: Operaciones sobre autores
  - name: posts
    description: Operaciones sobre publicaciones

paths:
  /authors:
    get:
      tags: [authors]
      summary: Listar todos los authors
      responses:
        '200':
          description: Lista de authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      tags: [authors]
      summary: Crear un author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Author creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Datos inválidos o email duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /authors/{id}:
    get:
      tags: [authors]
      summary: Obtener un author por id
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      responses:
        '200':
          description: Author encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Author no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [authors]
      summary: Actualizar un author
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '200':
          description: Author actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Datos inválidos o email duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Author no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [authors]
      summary: Borrar un author (borra en cascada sus posts)
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      responses:
        '204':
          description: Author borrado
        '404':
          description: Author no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts:
    get:
      tags: [posts]
      summary: Listar todos los posts
      responses:
        '200':
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      tags: [posts]
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Datos inválidos o author_id inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{id}:
    get:
      tags: [posts]
      summary: Obtener un post por id
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [posts]
      summary: Actualizar un post
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Datos inválidos o author_id inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [posts]
      summary: Borrar un post
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post borrado
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/author/{authorId}:
    get:
      tags: [posts]
      summary: Listar los posts de un author, con el detalle del author incluido
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de posts del author (vacía si no tiene, o si el author no existe)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostWithAuthor'

components:
  parameters:
    AuthorId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@miniblog.dev
        bio:
          type: string
          nullable: true
          example: Pionera de la programación.
        created_at:
          type: string
          format: date-time

    AuthorInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@miniblog.dev
        bio:
          type: string
          nullable: true
          example: Pionera de la programación.

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        author_id:
          type: integer
          example: 1
        title:
          type: string
          example: Cómo pensar en algoritmos
        content:
          type: string
          example: Contenido de ejemplo.
        published:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    PostInput:
      type: object
      required: [author_id, title, content]
      properties:
        author_id:
          type: integer
          example: 1
        title:
          type: string
          example: Cómo pensar en algoritmos
        content:
          type: string
          example: Contenido de ejemplo.
        published:
          type: boolean
          default: true

    PostWithAuthor:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        published:
          type: boolean
        created_at:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/Author'

    Error:
      type: object
      properties:
        message:
          type: string
          example: Author no encontrado
